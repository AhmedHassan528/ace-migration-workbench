<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Offline: no network access is needed or attempted. Everything, including Java decompilation, runs in this page.
     (No CSP meta tag: under file:// Chrome treats 'self' as an opaque origin and would block local scripts.) -->
<title>IBM ACE Migration Workbench</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">IBM ACE Migration Workbench <span class="ver" id="ver"></span></div>
  <div class="muted small">Five independent tools. Each page has its own input; nothing is shared between pages.</div>
</header>
<div class="layout">
  <nav class="sidenav" id="nav">
    <a data-view="barexport">1. BAR Export</a>
    <a data-view="migrate13">2. ACE 13 Migration</a>
    <a data-view="libconv">3. Static to Shared Libraries</a>
    <a data-view="compare">4. BAR vs Source</a>
    <a data-view="explorer">5. Source Explorer</a>
  </nav>
  <main id="view" class="view"></main>
</div>
<footer class="logdock" id="logdock">
  <div class="logbar">
    <div class="progress"><div class="progress-fill" id="progFill"></div><span id="progText">Idle</span></div>
    <button class="btn danger small" id="cancelBtn" disabled>Cancel</button>
    <button class="btn small" id="logToggle">Log ▾</button>
    <button class="btn small" id="logSave">Save log</button>
    <button class="btn small" id="logClear">Clear</button>
    <span class="counts" id="logCounts"></span>
  </div>
  <div class="logpanel" id="logPanel"></div>
</footer>
